# Example nginx site for running buZZprep behind an existing nginx on the host.
# 1. Remove "caddy" from COMPOSE_PROFILES in .env, then: docker compose up -d --build
# 2. Get a certificate, e.g.:  sudo certbot --nginx -d prep.example.com
# 3. Replace prep.example.com below with your subdomain and reload nginx.

server {
    listen 80;
    listen [::]:80;
    server_name prep.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name prep.example.com;

    ssl_certificate     /etc/letsencrypt/live/prep.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prep.example.com/privkey.pem;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Voice journal recordings (the API accepts up to 25 MB per clip).
    location ~ ^/api/v1/journal/entries/evening/[0-9-]+/clips$ {
        client_max_body_size 26m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
