name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Tap …
  - type: dropdown
    id: platform
    attributes:
      label: Where does it happen?
      options:
        - iPhone / iPad (installed Home Screen app)
        - iPhone / iPad (Safari tab)
        - Android
        - Desktop browser
        - Server / Docker
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: OS + browser version, and buZZprep version (Profile → bottom of the page).
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove personal data (journal text, emails, tokens) before posting.
